<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" width="128" height="128">
  <defs>
    <linearGradient id="wine" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#B4325A"/><stop offset="1" stop-color="#78182F"/>
    </linearGradient>
    <linearGradient id="gray" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#DDE2E8"/><stop offset="1" stop-color="#9AA3AF"/>
    </linearGradient>
    <!-- La cuna se dibuja mas larga de la cuenta y se recorta contra el disco,
         asi su borde derecho coincide exactamente con la silueta del anillo. -->
    <clipPath id="disc">
      <circle cx="64.0" cy="64.0" r="44.0"/>
    </clipPath>
  </defs>
  <rect width="128" height="128" rx="28" fill="#1B1D23"/>
  <path d="M 89.24,27.96 A 44.0 44.0 0 1 0 104.80,80.48 L 87.64,73.55 A 25.5 25.5 0 1 1 78.63,43.11 Z" fill="url(#wine)"/>
  <g clip-path="url(#disc)">
    <path d="M 82.0,48.0 L 122.0,48.0 L 122.0,76.0 L 57.0,76.0 Z" fill="url(#gray)"/>
  </g>
</svg>
