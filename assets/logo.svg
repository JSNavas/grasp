<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 300" width="520" height="300">
  <defs>
    <linearGradient id="wine" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#B4325A"/><stop offset="1" stop-color="#78182F"/>
    </linearGradient>
    <linearGradient id="gray" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#DDE2E8"/><stop offset="1" stop-color="#9AA3AF"/>
    </linearGradient>
    <!-- La cuna se dibuja mas larga de la cuenta y se recorta contra el disco,
         asi su borde derecho coincide exactamente con la silueta del anillo. -->
    <clipPath id="disc">
      <circle cx="64.0" cy="64.0" r="44.0"/>
    </clipPath>
  </defs>
  <rect width="520" height="300" rx="0" fill="#1B1D23"/>
  <g transform="translate(196 46)">
  <path d="M 89.24,27.96 A 44.0 44.0 0 1 0 106.73,74.52 L 88.76,70.09 A 25.5 25.5 0 1 1 78.63,43.11 Z" fill="url(#wine)"/>
  <g clip-path="url(#disc)">
    <path d="M 82.0,48.0 L 122.0,48.0 L 122.0,76.0 L 57.0,76.0 Z" fill="url(#gray)"/>
  </g>
  </g>
  <text x="252" y="228" text-anchor="middle" fill="#DDE2E8"
        font-family="-apple-system, BlinkMacSystemFont, 'Helvetica Neue', Arial, sans-serif"
        font-size="44" letter-spacing="16">Grasp</text>
  <text x="255" y="258" text-anchor="middle" fill="#9AA3AF" opacity="0.7"
        font-family="-apple-system, BlinkMacSystemFont, 'Helvetica Neue', Arial, sans-serif"
        font-size="12" letter-spacing="5">BLOQUES SEMANTICOS</text>
</svg>
